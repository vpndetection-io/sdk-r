name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 4.1 is the floor DESCRIPTION's Depends names, and CI is the only place it is checked.
        r: ['4.1', 'release']
    name: R ${{ matrix.r }}
    env:
      # Runs the clock-timed tests a CRAN check skips: testthat's skip_on_cran() also skips when
      # NOT_CRAN is unset.
      NOT_CRAN: 'true'
      # CRAN's incoming checks without asking CRAN itself, which a runner has no business doing on
      # every push.
      _R_CHECK_CRAN_INCOMING_REMOTE_: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
